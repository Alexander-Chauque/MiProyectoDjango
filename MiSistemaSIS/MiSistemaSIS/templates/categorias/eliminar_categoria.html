{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Eliminar Categoria</h1>
<p>¿Está seguro de que desea eliminar esta categoría?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'listar_categorias' %}" class="btn btn-secundario">Cancelar</a>
</form>
{% endblock %}
