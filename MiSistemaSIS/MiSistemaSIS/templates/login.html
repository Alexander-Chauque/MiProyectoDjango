{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Los Cardones</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-panel">
        <div class="login-card">
          <div class="login-header">
            <img
              src="{% static 'img/logo.jpg' %}"
              alt="Logo Los Cardones"
              class="login-logo"
            />
            <h1>LOS CARDONES</h1>
            <p>Sistema de Gestión Gastronómica</p>
          </div>

          <!-- Formulario -->
          <form method="POST" class="login-form">
            {% csrf_token %}
            <!-- Mensajes de Error -->
            {% if form.errors %}
            <div class="alerta-error">
              <span class="material-symbols-outlined">error</span>
              Usuario o contraseña incorrectos. Intente de nuevo.
            </div>
            {% endif %}
            <!-- Usuario -->
            <div class="input-group">
              <label for="username">USUARIO</label>
              <div class="input-con-icono">
                <span class="material-symbols-outlined">person</span>
                <input type="text" name="username" id="username" placeholder="Ingresá tu usuario" required autofocus/>
              </div>
            </div>
            <!-- Contraseña -->
            <div class="input-group">
              <label for="password">CONTRASEÑA</label>
              <div class="input-con-icono">
                <span class="material-symbols-outlined">lock</span>
                <input type="password" name="password" id="password" placeholder="Ingresá tu contraseña" required />
                <span class="material-symbols-outlined toggle-password" onclick="togglePassword()">visibility_off</span>
              </div>
            </div>
            <!-- Olvidé mi contraseña -->
            <div class="olvide-password">
              <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
            </div>
            <!-- Botón Ingresar -->
            <button type="submit" class="btn-login">
              <span class="material-symbols-outlined">login</span>
              INGRESAR
            </button>
            <div class="login-footer-form">
              <p>© 2026 Los Cardones</p>
              <p>Salta, Argentina</p>
            </div>
          </form>
        </div>
      </div>
    <script>
      function togglePassword() {
        const input = document.getElementById("id_password");
        const icono = document.querySelector(".toggle-password");

        if (input.type === "password") {
          input.type = "text";
          icono.textContent = "visibility";
        } else {
          input.type = "password";
          icono.textContent = "visibility_off";
        }
      }
    </script>
  </body>
</html>
