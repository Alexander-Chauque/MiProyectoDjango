<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Blog/base.css' %}">
    
    <!-- Estilos específicos para el Login (para que se vea como la imagen) -->
    <style>
        body {
            background-color: #f4f4f4; /* Fondo gris claro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-container {
            background-color: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-logo {
            max-width: 120px;
            margin-bottom: 20px;
        }
        .login-title {
            font-size: 24px;
            color: #1a237e; /* Azul oscuro */
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-login {
            background-color: #d3d3d3; /* Gris */
            color: black;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-login:hover {
            background-color: #b0b0b0;
        }
        .login-links a {
            text-decoration: none;
            color: #1a237e;
            display: block;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3074/3074261.png" alt="Logo" class="login-logo">
        
        <h1 class="login-title">Iniciar sesión</h1>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Nombre Usuario" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        
        <div class="login-links">
            <a href="#">¿Olvidaste tu contraseña?</a>
            <a href="#">Registrar a nuevo usuario</a>
        </div>
    </div>

</body>
</html>
