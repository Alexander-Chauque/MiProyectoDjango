{% extends 'base.html' %}
{% load static %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-titulo">Recuperar Contraseña</h1>
        <p class="login-subtitulo">
            Ingresá tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email" class="form-control" 
                       placeholder="tu@correo.com" required autofocus>
            </div>
            <button type="submit" class="btn-login">Enviar Enlace</button>
        </form>

        <p class="login-footer">
            <a href="{% url 'login' %}">Volver al inicio de sesión</a>
        </p>
    </div>
</div>
{% endblock %}
