{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Editar Ingrediente</h1>
<form method="POST">
    {% csrf_token %}
    <div class="form-grupo">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" value="{{ ingrediente.nombre }}" required>
    </div>
    <div class="form-grupo">
        <label class="form-label">Unidad de Medida</label>
        <input type="text" name="unidad_medida" class="form-control" value="{{ ingrediente.unidad_medida }}" required>
    </div>
    <div class="form-grupo">
        <label class="form-label">Costo Unitario</label>
        <input type="number" name="costo_unitario" class="form-control" step="0.01" value="{{ ingrediente.costo_unitario }}" required>
    </div>
    <button type="submit" class="btn">Guardar</button>
    <a href="{% url 'listar_ingredientes' %}" class="btn-secundario">Cancelar</a>
</form>
{% endblock %}
