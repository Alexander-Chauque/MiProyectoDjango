<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'Blog/base.css' %}">
    
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .cambiar-container {
            background-color: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .cambiar-title {
            font-size: 24px;
            color: #1a237e;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-cambiar {
            background-color: #d3d3d3;
            color: black;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-cambiar:hover {
            background-color: #b0b0b0;
        }
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="cambiar-container">
        <h1 class="cambiar-title">Cambiar Contraseña</h1>
        
        <p style="color: #666; margin-bottom: 20px;">
            Por seguridad, debes cambiar tu contraseña antes de continuar.
        </p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="password" name="nueva_contrasena" class="form-control" placeholder="Nueva Contraseña" required minlength="8">
            </div>
            <div class="form-group">
                <input type="password" name="confirmar_contrasena" class="form-control" placeholder="Confirmar Contraseña" required minlength="8">
            </div>
            <button type="submit" class="btn-cambiar">Cambiar Contraseña</button>
        </form>
    </div>

</body>
</html>
