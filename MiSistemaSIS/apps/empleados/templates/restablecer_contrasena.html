{% extends 'base.html' %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo">Restablecer Contraseña</h1>
    <p><strong>Usuario:</strong> {{ empleado.user_auto }}</p>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label">Nueva Contraseña</label>
                    {{ form.nueva_contrasena }}
                    {{ form.nueva_contrasena.errors }}
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    {{ form.confirmar_contrasena }}
                    {{ form.confirmar_contrasena.errors }}
                </div>

                <div class="derecha_boton">
                    <a href="{% url 'empleados:empleado_listar' %}" class="btn-secundario">Cancelar</a>
                    <button type="submit" class="btn">Restablecer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
