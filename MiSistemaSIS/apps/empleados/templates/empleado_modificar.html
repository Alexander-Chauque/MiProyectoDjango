{% extends 'base_empleados.html' %}
{% load static %}

{% block title %}Modificar Empleado{% endblock %}
{% block nav_brand %}Gestión de Empleados{% endblock %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo">Modificar Empleado</h1>

    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <!-- USUARIO (solo lectura) -->
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" value="{{ empleado.user_auto }}" class="form-control" disabled>
                </div>

                <!-- NOMBRE -->
                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre_empleado" value="{{ empleado.nombre_empleado }}" class="form-control" required>
                </div>

                <!-- APELLIDO -->
                <div class="form-group">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="apellido_empleado" value="{{ empleado.apellido_empleado }}" class="form-control" required>
                </div>

                <!-- DNI -->
                <div class="form-group">
                    <label class="form-label">DNI</label>
                    <input type="text" name="dni" value="{{ empleado.dni }}" class="form-control" required>
                </div>

                <!-- TELÉFONO -->
                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="text" name="telefono" value="{{ empleado.telefono|default:'' }}" class="form-control">
                </div>

                <!-- CORREO -->
                <div class="form-group">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="correo" value="{{ empleado.correo }}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Cargo</label>
                    <select name="cargo" class="form-control">
                        <option value="">Sin cargo</option>
                        {% for cargo in cargos %}
                            <option value="{{ cargo.pk }}" 
                                {% if empleado.cargo and empleado.cargo.pk == cargo.pk %}selected{% endif %}>
                                {{ cargo.nombre_cargo }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="derecha_boton">
                    <a href="{% url 'empleados:empleado_listar' %}" class="btn-secundario">Cancelar</a>
                    <button type="submit" class="btn-primario">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
