{% load l10n %}
{# Campo para el efectivo contado, con la diferencia calculada mientras se escribe. #}
<div class="grupo-campo contar-efectivo" data-contar-efectivo data-esperado="{{ saldo_esperado|unlocalize }}">
    <label for="saldo_contado">¿Cuánto efectivo hay en el cajón? <span class="req">*</span></label>
    <div class="input-con-prefijo">
        <span class="material-symbols-outlined" aria-hidden="true">attach_money</span>
        <input type="number" id="saldo_contado" name="saldo_contado" class="form-control"
               step="0.01" min="0" inputmode="decimal" required autocomplete="off"
               value="{{ saldo_contado|default_if_none:''|unlocalize }}"
               aria-describedby="saldo_contado_ayuda saldo_contado_diferencia">
    </div>
    <span class="texto-ayuda" id="saldo_contado_ayuda">Contá los billetes y monedas y escribí el total. Debería haber ${{ saldo_esperado|floatformat:2 }}.</span>
    <p class="contar-efectivo-diferencia" id="saldo_contado_diferencia" aria-live="polite" hidden></p>
</div>

<script>
  (function () {
    const caja = document.querySelector("[data-contar-efectivo]");
    if (!caja) return;
    const campo = caja.querySelector("input");
    const aviso = caja.querySelector(".contar-efectivo-diferencia");
    const esperado = parseFloat(caja.dataset.esperado);
    const pesos = (v) => "$" + Math.abs(v).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function mostrar() {
      const contado = parseFloat(campo.value);
      if (campo.value === "" || isNaN(contado)) { aviso.hidden = true; return; }
      const diferencia = Math.round((contado - esperado) * 100) / 100;
      aviso.hidden = false;
      aviso.className = "contar-efectivo-diferencia " + (diferencia === 0 ? "cuadra" : diferencia < 0 ? "falta" : "sobra");
      aviso.textContent = diferencia === 0
        ? "Cuadra: hay justo lo que debería haber."
        : diferencia < 0
          ? "Faltan " + pesos(diferencia) + " respecto de lo que debería haber."
          : "Sobran " + pesos(diferencia) + " respecto de lo que debería haber.";
    }
    campo.addEventListener("input", mostrar);
    mostrar();
  })();
</script>
