{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Eliminar Método de Pago</h1>
<p>¿Está seguro de que desea eliminar este método de pago?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'finanzas:listar_met_pago' %}" class="btn btn-secundario">Cancelar</a>
</form>
{% endblock %}
