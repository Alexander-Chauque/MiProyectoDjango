{% extends 'reportes/base_reportes.html' %}
{% block extra_css_reportes %}<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>{% endblock %}
{% block contenido_reporte %}
<div class="tarjeta-grafico" style="margin-top: 20px; max-width: 600px; margin-left: auto; margin-right: auto;">
  <div class="titulo-grafico"><span class="material-symbols-outlined icono-naranja">payments</span><h3>Métodos de Pago</h3></div>
  <div class="cuerpo-grafico" style="height: 300px;"><canvas id="graficoTorta"></canvas></div>
</div>
{% endblock %}
{% block extra_js %}
{{ labels_metodos|json_script:"labels-metodos" }}{{ data_metodos|json_script:"data-metodos" }}
<script>
  new Chart(document.getElementById('graficoTorta').getContext('2d'), {
    type: 'doughnut', data: {
      labels: JSON.parse(document.getElementById('labels-metodos').textContent),
      datasets: [{ data: JSON.parse(document.getElementById('data-metodos').textContent), backgroundColor: ['#F5A623', '#3B82F6', '#10B981', '#6366F1', '#9CA3AF'] }]
    }, options: { responsive: true, maintainAspectRatio: false }
  });
</script>
{% endblock %}
