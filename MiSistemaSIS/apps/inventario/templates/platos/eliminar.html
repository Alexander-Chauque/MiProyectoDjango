{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Eliminar Plato</h1>

<p>¿Estás seguro de que quieres eliminar el plato "{{ plato.nombre_plato }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Sí, Eliminar</button>
    <a href="{% url 'inventario:listar_platos' %}" class="btn-secundario">Cancelar</a>
</form>
{% endblock %}
