{% extends 'base_inventario.html' %}
{% load static %}

{% block title %}Crear Nuevo Plato{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/platos.css' %}">
{% endblock %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo">Crear Nuevo Plato</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="tarjeta">
            <div class="tarjeta-encabezado">
                <h3>Datos del Plato</h3>
            </div>
            <div class="tarjeta-cuerpo">
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Nombre</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Precio</label>
                    <input type="number" name="precio" class="form-control" step="0.01" required>
                </div>
                <div class="grupo-campo">
                    <label class="etiqueta-campo">Categoría</label>
                    <select name="categoria" class="form-control" required>
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}">{{ cat.nombre_categoria_plato }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        <div class="tarjeta">
            <div class="tarjeta-encabezado">
                <h3>Ingredientes</h3>
            </div>
            <div class="tarjeta-cuerpo">
                <div class="buscador-ingredientes">
                    <input type="text" id="buscador" placeholder="Buscar ingrediente..." class="form-control">
                </div>

                <div class="grid-ingredientes" id="lista-ingredientes">
                    {% for ing in ingredientes %}
                        <label class="ingrediente-item">
                            <input type="checkbox" name="ingredientes" value="{{ ing.id }}">
                            {{ ing.nombre_ingrediente }}
                        </label>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="botones-derecha">
            <a href="{% url 'inventario:listar_platos' %}" class="btn-secundario">Cancelar</a>
            <button type="submit" class="btn-primario">Guardar</button>
        </div>
    </form>
</div>

<script>
    // Buscador de ingredientes
    document.getElementById('buscador').addEventListener('input', function() {
        const texto = this.value.toLowerCase();
        document.querySelectorAll('.ingrediente-item').forEach(function(item) {
            const nombre = item.textContent.toLowerCase();
            item.style.display = nombre.includes(texto) ? 'flex' : 'none';
        });
    });
</script>
{% endblock %}
