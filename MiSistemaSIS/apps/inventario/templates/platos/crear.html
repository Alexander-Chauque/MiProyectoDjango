{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Crear Nuevo Plato</h1>

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" 
            pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+" 
            title="Solo letras y espacios" 
            required>
    </div>
    <div class="form-grupo">
        <label class="form-label">Precio</label>
        <input type="number" name="precio" class="form-control" step="0.01" required>
    </div>
    <div class="form-group">
    <label class="form-label">Categoría</label>
    <select name="categoria" class="form-control" required>
        {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nombre_categoria_plato }}</option>
        {% endfor %}
    </select>
</div>
    <div class="form-group">
        <label class="form-label">Ingredientes</label>
        <div class="grid-ingredientes">
            {% for ing in ingredientes %}
                <label>
                    <input type="checkbox" name="ingredientes" value="{{ ing.id }}" title="Seleccione un ingrediente para continuar">
                    {{ ing.nombre_ingrediente }}
                </label>
            {% endfor %}
        </div>
    </div>
    
    <button type="submit" class="btn">Guardar</button>
    <a href="{% url 'inventario:listar_platos' %}" class="btn-secundario">Cancelar</a>
    
</form>
