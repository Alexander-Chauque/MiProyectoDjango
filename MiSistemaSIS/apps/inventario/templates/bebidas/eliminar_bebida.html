{% extends 'base_inventario.html' %}

{% block title %}Eliminar Bebida{% endblock %}

{% block content %}
<div class="contenedor">
    <h1 class="titulo">Eliminar Bebida</h1>

    <div class="card">
        <div class="card-body text-center">
            <p>¿Estás seguro de eliminar <strong>{{ bebida.nombre_bebida }}</strong>?</p>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="derecha_boton">
                    <a href="{% url 'inventario:bebida_listar' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
