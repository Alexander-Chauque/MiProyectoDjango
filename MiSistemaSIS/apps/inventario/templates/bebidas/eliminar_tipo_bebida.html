{% extends 'base_inventario.html' %}

{% block title %}Eliminar tipo de bebida{% endblock %}

{% block contenido_simple %}
<div class="contenedor">
    <h1 class="titulo">Eliminar tipo de bebida</h1>

    <div class="card">
        <div class="card-body text-center">
            <p>¿Estás seguro de eliminar <strong>{{ tipo.nombre_tipo_bebida }}</strong>?</p>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="derecha_boton">
                    <a href="{% url 'inventario:listar_tipo_bebida' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
