{% extends 'base.html' %}

{% block content %}
<h1 class="titulo">Eliminar Ingrediente</h1>
<p>¿Está seguro de que desea eliminar este ingrediente?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'inventario:listar_ingredientes' %}" class="btn btn-secundario">Cancelar</a>
</form>
{% endblock %}
